# Unihertz Titan Pocket, Linux 6.12 sound card (titanpocket, our machine
# driver on the MT8183 AFE; docs/audio.md). Playback is DL1 (hw:0,0) to the
# loudspeaker (I2S3, FS1860 amp) or the MT6358 codec (earpiece,
# headphones); capture is UL1 (hw:0,2) from the codec's ADC.
Syntax 4

SectionUseCase."HiFi" {
	File "/Unihertz/titan-pocket/HiFi.conf"
	Comment "Play and record"
}

SectionUseCase."Voice Call" {
	File "/Unihertz/titan-pocket/VoiceCall.conf"
	Comment "Phone call"
}

# no route is on until a device is enabled
BootSequence [
	cset "name='RCV Mux' Open"
	cset "name='HPL Mux' Open"
	cset "name='HPR Mux' Open"
]
