# Play and record. DL1 reaches the loudspeaker through I2S3 and the codec
# (earpiece, headphones) through the AFE's ADDA link; the codec's outputs
# are chosen by its muxes. The microphones are the codec's preamplifier
# inputs: AIN0 the main one (bottom), AIN2 the back one, AIN1 the headset's,
# in DCC mode (the board's); the uplink powers up while UL1 is open.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Loudspeaker"

	EnableSequence [
		cset "name='I2S3_CH1 DL1_CH1' on"
		cset "name='I2S3_CH2 DL1_CH2' on"
	]
	DisableSequence [
		cset "name='I2S3_CH1 DL1_CH1' off"
		cset "name='I2S3_CH2 DL1_CH2' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Speaker Amp"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='RCV Mux' Voice Playback"
	]
	DisableSequence [
		cset "name='RCV Mux' Open"
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
	]
	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]
	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
	}
}

SectionDevice."Mic" {
	Comment "Main microphone"
	ConflictingDevice [
		"Mic2"
		"Headset"
	]

	EnableSequence [
		cset "name='Mic Type Mux' DCC"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN0"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA"
	}
}

SectionDevice."Mic2" {
	Comment "Back microphone"
	ConflictingDevice [
		"Mic"
		"Headset"
	]

	EnableSequence [
		cset "name='Mic Type Mux' DCC"
		cset "name='PGA L Mux' AIN2"
		cset "name='PGA R Mux' AIN2"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]
	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"
	ConflictingDevice [
		"Mic"
		"Mic2"
	]

	EnableSequence [
		cset "name='Mic Type Mux' DCC"
		cset "name='PGA L Mux' AIN1"
		cset "name='PGA R Mux' AIN1"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "PGA"
	}
}
