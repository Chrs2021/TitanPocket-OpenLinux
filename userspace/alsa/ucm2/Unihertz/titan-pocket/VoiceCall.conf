# A phone call: the modem's voice runs through the AFE's internal modem PCM
# interface (PCM 2), codec ADC -> modem uplink, modem downlink -> codec DAC
# or the loudspeaker's I2S3, with no CPU in the path. The routes only carry
# sound while the Hostless_Speech PCM (hw:0,5) is open both ways and the
# modem's speech is on (docs/modem.md, "Speech"); whatever handles the call
# does both. Untested in a call: the modem's speech DSP still returned
# silence in loopback (2026-11-03).

SectionVerb {
	Value {
		TQ "Voice"
		PlaybackPCM "hw:${CardId},5"
		CapturePCM "hw:${CardId},5"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1' on"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1' on"
		cset "name='RCV Mux' Voice Playback"
	]
	DisableSequence [
		cset "name='RCV Mux' Open"
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1' off"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackMixerElem "Handset"
	}
}

SectionDevice."Speaker" {
	Comment "Loudspeaker"
	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='I2S3_CH1 PCM_2_CAP_CH1' on"
		cset "name='I2S3_CH2 PCM_2_CAP_CH1' on"
	]
	DisableSequence [
		cset "name='I2S3_CH1 PCM_2_CAP_CH1' off"
		cset "name='I2S3_CH2 PCM_2_CAP_CH1' off"
	]
	Value {
		PlaybackPriority 50
		PlaybackMixerElem "Speaker Amp"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1' on"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1' on"
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]
	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1' off"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackMixerElem "Headphone"
	}
}

SectionDevice."Mic" {
	Comment "Main microphone"
	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='Mic Type Mux' DCC"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN2"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1' on"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1' off"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]
	Value {
		CapturePriority 100
		CaptureMixerElem "PGA"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"
	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='Mic Type Mux' DCC"
		cset "name='PGA L Mux' AIN1"
		cset "name='PGA R Mux' AIN1"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1' on"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1' off"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]
	Value {
		CapturePriority 200
		CaptureMixerElem "PGA"
	}
}
