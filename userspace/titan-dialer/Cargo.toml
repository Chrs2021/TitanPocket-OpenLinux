[package]
name = "titan-dialer"
version = "0.1.0"
edition = "2021"
description = "Phone for the Titan Pocket: keypad, calls (VoLTE through titan-ims, or ModemManager), USSD, proximity blanking"
license = "GPL-2.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
