# SPDX-License-Identifier: GPL-2.0-or-later
# The loudspeaker as a PipeWire sink (docs/audio.md).
#
# - Linux 4.14: ALSA device 7 (I2S0DL1_PLayback) of mt-snd-card carries the
#   speaker samples. Linux 6.12: device 0 (DL1) of the titanpocket card,
#   routed to I2S3 (the amp) by /etc/udev/rules.d/91-titan-audio.rules.
#   Both are listed with "nofail": each kernel has only one of the cards,
#   and the other entry is skipped instead of failing PipeWire's start.
# - The AFE card has no UCM profile, so WirePlumber's ALSA monitor is off
#   (/etc/wireplumber/main.lua.d/51-titan.lua) and the sink is defined here.
# - mmap access plays silence on this driver: read/write only.
# - 48 kHz only (I2S clock rate); 4 x 1024-frame periods = 16 KB, above the
#   8 KB that would put the buffer in the AFE's on-chip SRAM (garbled).
# - The amp is powered by titan-speakerd (4.14) or by ASoC's DAPM (6.12)
#   while the device is open; PipeWire closes it after a few seconds of
#   silence.
context.objects = [
    {   factory = adapter
        flags   = [ nofail ]
        args = {
            factory.name          = api.alsa.pcm.sink
            node.name             = "titan-speaker"
            node.description      = "Loudspeaker (direct)"
            media.class           = "Audio/Sink"
            api.alsa.path         = "hw:0,7"
            api.alsa.disable-mmap = true
            api.alsa.period-size  = 1024
            api.alsa.period-num   = 4
            audio.format          = "S16LE"
            audio.rate            = 48000
            audio.channels        = 2
            audio.position        = [ FL FR ]
            priority.driver       = 2000
            priority.session      = 2000
        }
    }
    {   factory = adapter
        flags   = [ nofail ]
        args = {
            factory.name          = api.alsa.pcm.sink
            node.name             = "titan-speaker"
            node.description      = "Loudspeaker (direct)"
            media.class           = "Audio/Sink"
            api.alsa.path         = "hw:CARD=titanpocket,DEV=0"
            api.alsa.disable-mmap = true
            api.alsa.period-size  = 1024
            api.alsa.period-num   = 4
            audio.format          = "S16LE"
            audio.rate            = 48000
            audio.channels        = 2
            audio.position        = [ FL FR ]
            priority.driver       = 2000
            priority.session      = 2000
        }
    }
]
