# Limiter in front of the loudspeaker: apps play into "Loudspeaker" (this
# filter, the default sink), which feeds the hardware sink titan-speaker
# (50-titan-speaker.conf). Peaks are held at -1 dBFS, so loud content can't
# clip into the amp.
#
# Plugin: swh-plugins fast_lookahead_limiter (LADSPA): 5 ms lookahead, so it
# catches peaks before they happen instead of reacting after.
#   Input gain (dB)   gain before limiting (raise it to make quiet content
#                     louder; the limiter keeps the peaks in check)
#   Limit (dB)        output ceiling
#   Release time (s)  how fast the gain recovers after a peak
#
# The playback side is passive: with no app playing it doesn't keep the
# hardware sink running, so PipeWire still closes the device after a few
# seconds of silence and titan-speakerd powers the amp off.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Loudspeaker"
            media.name       = "Loudspeaker"
            filter.graph = {
                nodes = [
                    {   type    = ladspa
                        name    = limiter
                        plugin  = fast_lookahead_limiter_1913
                        label   = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 0
                            "Limit (dB)"       = -1
                            "Release time (s)" = 0.2
                        }
                    }
                ]
                inputs  = [ "limiter:Input 1" "limiter:Input 2" ]
                outputs = [ "limiter:Output 1" "limiter:Output 2" ]
            }
            audio.rate     = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "titan-speaker-limited"
                media.class      = "Audio/Sink"
                priority.session = 2100
                priority.driver  = 2100
            }
            playback.props = {
                node.name       = "titan-speaker-limiter-out"
                node.passive    = true
                target.object   = "titan-speaker"
                stream.dont-remix = true
            }
        }
    }
]
